<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>نظام إدارة محل الأجهزة الكهربائية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#1a56db; --primary-dark:#1544ac; --success:#16a34a; --danger:#dc2626;
  --warning:#d97706; --bg:#f4f6fa; --surface:#ffffff; --border:#e5e9f0;
  --text:#1f2937; --text-muted:#6b7280; --sidebar-bg:#101828; --sidebar-text:#cbd5e1; --radius:12px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:"Cairo",sans-serif;background:var(--bg);color:var(--text);direction:rtl;}
#app{min-height:100vh;}
.hidden{display:none !important;}

/* Login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#101828,#1a56db);}
.login-card{background:#fff;width:400px;max-width:100%;padding:34px 30px;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.25);}
.login-card h1{font-size:20px;margin:0 0 4px;}
.login-card p{color:var(--text-muted);font-size:13.5px;margin:0 0 20px;}
.tabs{display:flex;gap:8px;margin-bottom:18px;background:#f4f6fa;padding:4px;border-radius:10px;}
.tabs button{flex:1;padding:9px;border:none;background:transparent;border-radius:8px;font-family:inherit;font-weight:700;font-size:13.5px;cursor:pointer;color:var(--text-muted);}
.tabs button.active{background:#fff;color:var(--primary);box-shadow:0 1px 3px rgba(0,0,0,.1);}
.hint-box{background:#eff6ff;color:var(--primary-dark);padding:10px 12px;border-radius:9px;font-size:12px;margin-bottom:14px;line-height:1.7;}

/* Shell */
.app-shell{display:flex;min-height:100vh;}
.sidebar{width:250px;background:var(--sidebar-bg);color:var(--sidebar-text);display:flex;flex-direction:column;padding:20px 14px;flex-shrink:0;}
.sidebar-logo{color:#fff;font-size:17px;font-weight:800;padding:10px 8px 20px;border-bottom:1px solid #1f2a3d;margin-bottom:14px;}
.sidebar nav{display:flex;flex-direction:column;gap:3px;}
.sidebar button.navlink{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;color:var(--sidebar-text);padding:11px 14px;border-radius:10px;font-size:14px;font-weight:500;transition:.15s;}
.sidebar button.navlink:hover{background:#1c2637;color:#fff;}
.sidebar button.navlink.active{background:var(--primary);color:#fff;}
.main-area{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{height:60px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0;}
.topbar strong{font-size:15px;}
.user-info{font-size:13.5px;color:var(--text-muted);display:flex;align-items:center;gap:12px;}
.page-content{padding:22px;flex:1;overflow:auto;}

/* Stat cards */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;}
.stat-card .label{font-size:12.5px;color:var(--text-muted);margin-bottom:7px;}
.stat-card .value{font-size:22px;font-weight:800;}
.stat-card.highlight{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;grid-column:span 2;}
.stat-card.highlight .label{color:#dbe6fd;}
.stat-card .value.green{color:var(--success);}
.stat-card .value.red{color:var(--danger);}
.stat-card .value.orange{color:var(--warning);}

/* Panels/tables */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:18px;}
.panel h3{margin:0 0 12px;font-size:15px;}
.charts-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;}
@media(max-width:900px){.charts-grid{grid-template-columns:1fr;} .stat-card.highlight{grid-column:span 1;} .sidebar{width:70px;} .sidebar .navlabel{display:none;}}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
thead th{text-align:right;color:var(--text-muted);font-weight:600;padding:9px 6px;border-bottom:1px solid var(--border);font-size:12.5px;}
tbody td{padding:9px 6px;border-bottom:1px solid var(--border);}
tbody tr:hover{background:#fafbfc;}
.empty-row td{text-align:center;color:var(--text-muted);padding:18px;}

/* Buttons/inputs */
.btn{background:var(--primary);color:#fff;border:none;padding:9px 16px;border-radius:9px;font-family:inherit;font-weight:600;font-size:13.5px;cursor:pointer;}
.btn:hover{background:var(--primary-dark);}
.btn.secondary{background:#fff;color:var(--text);border:1px solid var(--border);}
.btn.danger{background:#fff;color:var(--danger);border:1px solid #fecaca;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.input,select.input{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:9px;font-family:inherit;font-size:13.5px;}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600;}
.badge.low{background:#fef2f2;color:var(--danger);}
.badge.ok{background:#f0fdf4;color:var(--success);}
.badge.new{background:#eff6ff;color:var(--primary);}
.badge.used{background:#fffbeb;color:var(--warning);}
.badge.admin{background:#f5f3ff;color:#7c3aed;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12.5px;margin-bottom:5px;color:var(--text-muted);}
.error-box{background:#fef2f2;color:var(--danger);padding:9px 12px;border-radius:9px;font-size:12.5px;margin-bottom:12px;}
.success-toast{position:fixed;bottom:24px;left:24px;background:var(--success);color:#fff;padding:12px 20px;border-radius:10px;font-size:13.5px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.2);z-index:100;}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
.modal-box{background:#fff;border-radius:14px;padding:22px;width:560px;max-width:100%;max-height:88vh;overflow-y:auto;}
.modal-box h3{margin-top:0;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.form-grid .full{grid-column:span 2;}
@media(max-width:520px){.form-grid{grid-template-columns:1fr;} .form-grid .full{grid-column:span 1;}}

/* POS specific */
.pos-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;}
@media(max-width:900px){.pos-grid{grid-template-columns:1fr;}}
.pos-product{display:flex;justify-content:space-between;align-items:center;padding:10px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer;}
.pos-product:hover{border-color:var(--primary);background:#f5f8ff;}
.cart-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13.5px;}
.qty-controls{display:flex;align-items:center;gap:6px;}
.qty-controls button{width:24px;height:24px;border-radius:6px;border:1px solid var(--border);background:#fff;cursor:pointer;}
.total-row{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;}
.total-row.grand{font-weight:800;font-size:17px;border-top:1px solid var(--border);padding-top:10px;margin-top:6px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ==========================================================
   طبقة التخزين — localStorage عادي وموثوق (يعمل عند فتح
   الملف مباشرة في المتصفح كموقع مستقل، بدون أي سيرفر)
   ========================================================== */
const STORAGE_KEY = "store_app_data_v2";
const SESSION_KEY = "store_app_session_v2";

function defaultData(){
  return {
    categories: ["غسالات","برادات وفريزرات","أفران","مكيفات","سخانات","مراوح","أدوات كهربائية متنوعة"],
    products: [],
    customers: [],
    suppliers: [],
    sales: [],
    purchases: [],
    expenses: [],
    employees: [],       // { id, name, username, password, role, active }
    adminPassword: "admin123",
    invoiceSeq: 1000,
  };
}

let DATA = defaultData();

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      DATA = JSON.parse(raw);
    }
  }catch(e){
    console.error("تعذرت قراءة البيانات المحفوظة، سيتم البدء ببيانات جديدة", e);
    DATA = defaultData();
  }
  // ضمان وجود الحقول الجديدة حتى لو كانت البيانات المحفوظة من نسخة سابقة
  if(!DATA.employees) DATA.employees = [];
  if(!DATA.adminPassword) DATA.adminPassword = "admin123";
  if(!DATA.categories) DATA.categories = defaultData().categories;
}

function saveData(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA));
    return true;
  }catch(e){
    console.error("تعذر حفظ البيانات", e);
    alert("تعذر حفظ البيانات في هذا المتصفح. تأكد أن المتصفح لا يحظر التخزين المحلي (وضع التصفح الخفي مثلًا يمنع ذلك).");
    return false;
  }
}

function uid(prefix){ return prefix + "_" + Math.random().toString(36).slice(2,9); }
// تنقية أي نص يُدخله المستخدم قبل حقنه داخل HTML أو داخل قيمة attribute،
// لمنع كسر الواجهة عند وجود علامات اقتباس أو أقواس (مثال شائع بمحل أجهزة:
// اسم منتج فيه علامة بوصة " كـ 50" أو أقواس زاوية)
function esc(str){
  if(str===null || str===undefined) return "";
  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
// مهم: نستخدم مكوّنات التاريخ المحلية (وليس toISOString التي تحوّل لتوقيت UTC)
// حتى لا تُحسب مبيعات آخر الليل على اليوم الخاطئ في Dashboard والتقارير
function todayStr(d){
  const dt = d ? new Date(d) : new Date();
  const y = dt.getFullYear();
  const m = String(dt.getMonth()+1).padStart(2,"0");
  const day = String(dt.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
// أرقام لاتينية ثابتة (0-9) بدل الأرقام الهندية العربية التي قد تظهر بشكل غير متوقع
// حسب المتصفح، لضمان وضوح الأرقام المالية دائمًا
function money(n){ return (Number(n)||0).toLocaleString("en-US",{maximumFractionDigits:2}) + " $"; }

/* ==========================================================
   الجلسة الحالية: إما المدير أو موظف مسجل عبر حسابه
   ========================================================== */
let SESSION = null; // { role: 'ADMIN'|'SALES'|'INVENTORY', name, employeeId? }
let CURRENT_PAGE = "dashboard";

// كل حالة الواجهة المؤقتة (سلة البيع، نتائج البحث...) يجب تصفيرها بين جلستَي مستخدمَين
// مختلفين على نفس الجهاز، وإلا قد يرى موظف بيانات جلسة موظف سبقه بالخطأ
function resetTransientState(){
  cart = [];
  posSearch = "";
  posCustomerName = "";
  posCustomerPhone = "";
  productSearch = "";
  loginTab = "employee";
}

function loadSession(){
  try{
    const raw = localStorage.getItem(SESSION_KEY);
    if(raw) SESSION = JSON.parse(raw);
  }catch(e){ SESSION = null; }
}
function saveSession(){
  try{ localStorage.setItem(SESSION_KEY, JSON.stringify(SESSION)); }catch(e){}
}
function clearSession(){
  SESSION = null;
  try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
}

const roleLabels = { ADMIN:"مدير", SALES:"مبيعات", INVENTORY:"مخزون" };
function role(){ return SESSION ? SESSION.role : null; }
function canManageProducts(){ return role()==="ADMIN" || role()==="INVENTORY"; }
function canDelete(){ return role()==="ADMIN"; }
function canSell(){ return role()==="ADMIN" || role()==="SALES"; }
function canManageExpenses(){ return role()==="ADMIN"; }
function isAdmin(){ return role()==="ADMIN"; }

function toast(msg){
  const el = document.createElement("div");
  el.className = "success-toast";
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2200);
}

/* ==========================================================
   حسابات مشتقة
   ========================================================== */
function todaySales(){ const t = todayStr(); return DATA.sales.filter(s=>todayStr(s.date)===t); }
function todayExpenses(){ const t = todayStr(); return DATA.expenses.filter(e=>todayStr(e.date)===t); }
function lowStockProducts(){ return DATA.products.filter(p=>Number(p.quantity) <= Number(p.minQuantity ?? 2)); }
function totalDebts(){ return DATA.customers.reduce((s,c)=>s+(Number(c.remainingAmount)||0),0); }

/* ==========================================================
   تسجيل الدخول
   ========================================================== */
let loginTab = "employee"; // "employee" | "admin"

function renderLogin(){
  const app = document.getElementById("app");
  app.innerHTML = `
  <div class="login-wrap">
    <div class="login-card">
      <h1>تسجيل الدخول</h1>
      <p>نظام إدارة محل الأجهزة الكهربائية</p>
      <div class="tabs">
        <button id="tabEmployee" class="${loginTab==='employee'?'active':''}">دخول موظف</button>
        <button id="tabAdmin" class="${loginTab==='admin'?'active':''}">دخول المدير</button>
      </div>
      <div id="errorSlot"></div>
      <div id="loginFormSlot"></div>
    </div>
  </div>`;

  document.getElementById("tabEmployee").onclick = ()=>{ loginTab="employee"; renderLogin(); };
  document.getElementById("tabAdmin").onclick = ()=>{ loginTab="admin"; renderLogin(); };

  const slot = document.getElementById("loginFormSlot");

  if(loginTab==="admin"){
    slot.innerHTML = `
      ${DATA.employees.length===0 && DATA.adminPassword==="admin123" ? '<div class="hint-box">أول مرة تدخل؟ كلمة مرور المدير الافتراضية هي: <strong>admin123</strong> — يفضل تغييرها من صفحة الموظفين لاحقًا.</div>' : ''}
      <form id="adminForm">
        <div class="field"><label>كلمة مرور المدير</label><input type="password" class="input" name="password" required autofocus></div>
        <button class="btn" style="width:100%" type="submit">دخول كمدير</button>
      </form>`;
    document.getElementById("adminForm").onsubmit = (e)=>{
      e.preventDefault();
      const pass = new FormData(e.target).get("password");
      if(pass === DATA.adminPassword){
        SESSION = { role:"ADMIN", name:"المدير العام" };
        saveSession();
        CURRENT_PAGE = "dashboard";
        renderShell();
      } else {
        document.getElementById("errorSlot").innerHTML = '<div class="error-box">كلمة المرور غير صحيحة</div>';
      }
    };
  } else {
    const hasEmployees = DATA.employees.filter(e=>e.active!==false).length > 0;
    slot.innerHTML = `
      ${!hasEmployees ? '<div class="hint-box">لا يوجد موظفون مضافون بعد. سجّل دخول كمدير أولًا ثم أضف حسابات الموظفين من صفحة "الموظفون".</div>' : ''}
      <form id="empForm">
        <div class="field"><label>اسم المستخدم</label><input class="input" name="username" required autofocus></div>
        <div class="field"><label>كلمة المرور</label><input type="password" class="input" name="password" required></div>
        <button class="btn" style="width:100%" type="submit">دخول</button>
      </form>`;
    document.getElementById("empForm").onsubmit = (e)=>{
      e.preventDefault();
      const fd = new FormData(e.target);
      const username = fd.get("username").trim();
      const password = fd.get("password");
      const emp = DATA.employees.find(x=>x.username===username && x.active!==false);
      if(emp && emp.password===password){
        SESSION = { role: emp.role, name: emp.name, employeeId: emp.id };
        saveSession();
        CURRENT_PAGE = "dashboard";
        renderShell();
      } else {
        document.getElementById("errorSlot").innerHTML = '<div class="error-box">اسم المستخدم أو كلمة المرور غير صحيحة</div>';
      }
    };
  }
}

/* ==========================================================
   الهيكل العام (Sidebar + Topbar) — يُبنى مرة واحدة،
   والتنقل بين الصفحات يحدّث page-content فقط (بدون إعادة بناء
   كامل الهيكل)، لضمان تنقل موثوق 100%.
   ========================================================== */
function navItemsForRole(){
  const base = [
    {key:"dashboard", label:"الرئيسية", icon:"🏠"},
    {key:"products", label:"المنتجات والمخزون", icon:"📦"},
    {key:"pos", label:"نقطة البيع", icon:"🧾"},
    {key:"customers", label:"العملاء", icon:"👤"},
    {key:"suppliers", label:"الموردون", icon:"🚚"},
    {key:"expenses", label:"المصاريف", icon:"💸"},
    {key:"reports", label:"التقارير", icon:"📊"},
  ];
  if(isAdmin()) base.push({key:"employees", label:"الموظفون", icon:"🧑‍💼"});
  return base;
}
const PAGE_TITLES = {dashboard:"الرئيسية", products:"المنتجات والمخزون", pos:"نقطة البيع", customers:"العملاء", suppliers:"الموردون", expenses:"المصاريف", reports:"التقارير", employees:"الموظفون"};

function renderShell(){
  const app = document.getElementById("app");
  app.innerHTML = `
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-logo">⚡ نظام إدارة المحل</div>
      <nav id="nav"></nav>
    </aside>
    <div class="main-area">
      <div class="topbar">
        <strong id="pageTitle"></strong>
        <div class="user-info">
          <span>${SESSION.name} — <span class="badge ${isAdmin()?'admin':'ok'}">${roleLabels[role()]}</span></span>
          <button class="btn secondary" id="logoutBtn">تسجيل الخروج</button>
        </div>
      </div>
      <div class="page-content" id="pageContent"></div>
    </div>
  </div>`;

  document.getElementById("logoutBtn").onclick = ()=>{
    clearSession();
    resetTransientState();
    renderLogin();
  };

  // نستخدم event delegation على nav بدل ربط كل زر منفصل، لضمان أن
  // التنقل يعمل دائمًا حتى لو أُعيد رسم الهيكل عدة مرات
  const nav = document.getElementById("nav");
  nav.innerHTML = navItemsForRole().map(item=>
    `<button type="button" class="navlink" data-page="${item.key}">${item.icon} <span class="navlabel">${item.label}</span></button>`
  ).join("");

  nav.addEventListener("click", (e)=>{
    const btn = e.target.closest("button[data-page]");
    if(!btn) return;
    goToPage(btn.dataset.page);
  });

  updateActiveNav();
  document.getElementById("pageTitle").textContent = PAGE_TITLES[CURRENT_PAGE] || "";
  renderPage();
}

function updateActiveNav(){
  document.querySelectorAll(".sidebar button.navlink").forEach(b=>{
    b.classList.toggle("active", b.dataset.page===CURRENT_PAGE);
  });
}

// الدالة المسؤولة فعليًا عن الانتقال بين الصفحات
function goToPage(pageKey){
  CURRENT_PAGE = pageKey;
  const titleEl = document.getElementById("pageTitle");
  if(titleEl) titleEl.textContent = PAGE_TITLES[pageKey] || "";
  updateActiveNav();
  renderPage();
}

function renderPage(){
  const c = document.getElementById("pageContent");
  if(!c) return;
  c.innerHTML = ""; // تفريغ صريح لضمان عدم بقاء محتوى الصفحة السابقة
  if(CURRENT_PAGE==="dashboard") return renderDashboard(c);
  if(CURRENT_PAGE==="products") return renderProducts(c);
  if(CURRENT_PAGE==="pos") return renderPOS(c);
  if(CURRENT_PAGE==="customers") return renderCustomers(c);
  if(CURRENT_PAGE==="suppliers") return renderSuppliers(c);
  if(CURRENT_PAGE==="expenses") return renderExpenses(c);
  if(CURRENT_PAGE==="reports") return renderReports(c);
  if(CURRENT_PAGE==="employees") return renderEmployees(c);
}

/* ==========================================================
   الموظفون (صفحة خاصة بالمدير فقط)
   ========================================================== */
function renderEmployees(container){
  if(!isAdmin()){
    container.innerHTML = `<div class="panel">هذه الصفحة خاصة بالمدير فقط.</div>`;
    return;
  }
  container.innerHTML = `
    <div class="toolbar">
      <strong style="font-size:13.5px;color:var(--text-muted);">${DATA.employees.length} حساب موظف</strong>
      <div style="display:flex;gap:8px;">
        <button class="btn secondary" id="changeAdminPassBtn">تغيير كلمة مرور المدير</button>
        <button class="btn" id="addEmpBtn">+ إضافة موظف</button>
      </div>
    </div>
    <div class="panel">
      <table>
        <thead><tr><th>الاسم</th><th>اسم المستخدم</th><th>الدور</th><th>الحالة</th><th></th></tr></thead>
        <tbody id="empBody"></tbody>
      </table>
    </div>
    <div class="panel" style="font-size:12.5px;color:var(--text-muted);line-height:1.8;">
      💡 الموظف بدور <strong>مبيعات</strong> يقدر يبيع ويدير العملاء فقط، بدون حذف منتجات أو تعديل الأسعار.<br>
      💡 الموظف بدور <strong>مخزون</strong> يقدر يضيف بضاعة ويدير المخزون فقط، بدون الوصول لنقطة البيع أو المصاريف.<br>
      💡 لا أحد غير المدير يقدر يوصل لهذه الصفحة أو يحذف منتجات أو يدير المصاريف.
    </div>
  `;

  function refreshTable(){
    const body = document.getElementById("empBody");
    if(DATA.employees.length===0){
      body.innerHTML = `<tr class="empty-row"><td colspan="5">لا يوجد موظفون بعد</td></tr>`;
      return;
    }
    body.innerHTML = DATA.employees.map(emp=>`
      <tr>
        <td>${esc(emp.name)}</td>
        <td>${esc(emp.username)}</td>
        <td><span class="badge ok">${roleLabels[emp.role]}</span></td>
        <td>${emp.active!==false ? '<span class="badge ok">نشط</span>' : '<span class="badge low">موقوف</span>'}</td>
        <td>
          <button class="btn secondary" data-toggle="${emp.id}">${emp.active!==false?'إيقاف':'تفعيل'}</button>
          <button class="btn danger" data-remove="${emp.id}">حذف</button>
        </td>
      </tr>
    `).join("");

    body.querySelectorAll("[data-toggle]").forEach(b=>{
      b.onclick = ()=>{
        const emp = DATA.employees.find(x=>x.id===b.dataset.toggle);
        emp.active = emp.active===false ? true : false;
        saveData();
        refreshTable();
        toast(emp.active ? "تم تفعيل الحساب" : "تم إيقاف الحساب");
      };
    });
    body.querySelectorAll("[data-remove]").forEach(b=>{
      b.onclick = ()=>{
        if(!confirm("هل أنت متأكد من حذف حساب هذا الموظف؟")) return;
        DATA.employees = DATA.employees.filter(x=>x.id!==b.dataset.remove);
        saveData();
        refreshTable();
        toast("تم حذف الحساب");
      };
    });
  }
  refreshTable();

  document.getElementById("addEmpBtn").onclick = ()=>{
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.innerHTML = `
      <form class="modal-box" style="width:420px;">
        <h3>إضافة حساب موظف</h3>
        <div id="empFormError"></div>
        <div class="field"><label>اسم الموظف</label><input class="input" name="name" required></div>
        <div class="field"><label>اسم المستخدم</label><input class="input" name="username" required></div>
        <div class="field"><label>كلمة المرور</label><input class="input" name="password" required></div>
        <div class="field"><label>الدور الوظيفي</label>
          <select class="input" name="empRole">
            <option value="SALES">مبيعات</option>
            <option value="INVENTORY">مخزون</option>
          </select>
        </div>
        <div style="display:flex;gap:10px;margin-top:10px;">
          <button class="btn" type="submit">حفظ الحساب</button>
          <button class="btn secondary" type="button" id="cancelEmp">إلغاء</button>
        </div>
      </form>`;
    document.body.appendChild(overlay);
    overlay.onclick = e=>{ if(e.target===overlay) overlay.remove(); };
    overlay.querySelector("#cancelEmp").onclick = ()=>overlay.remove();
    overlay.querySelector("form").onsubmit = (e)=>{
      e.preventDefault();
      const fd = new FormData(e.target);
      const username = fd.get("username").trim();
      if(DATA.employees.some(x=>x.username===username)){
        overlay.querySelector("#empFormError").innerHTML = '<div class="error-box">اسم المستخدم هذا مستخدم مسبقًا</div>';
        return;
      }
      DATA.employees.push({
        id: uid("emp"), name: fd.get("name"), username,
        password: fd.get("password"), role: fd.get("empRole"), active: true,
      });
      saveData();
      overlay.remove();
      refreshTable();
      toast("تمت إضافة الموظف بنجاح");
    };
  };

  document.getElementById("changeAdminPassBtn").onclick = ()=>{
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.innerHTML = `
      <form class="modal-box" style="width:400px;">
        <h3>تغيير كلمة مرور المدير</h3>
        <div class="field"><label>كلمة المرور الجديدة</label><input class="input" name="newPass" required></div>
        <div style="display:flex;gap:10px;margin-top:10px;">
          <button class="btn" type="submit">حفظ</button>
          <button class="btn secondary" type="button" id="cancelPass">إلغاء</button>
        </div>
      </form>`;
    document.body.appendChild(overlay);
    overlay.onclick = e=>{ if(e.target===overlay) overlay.remove(); };
    overlay.querySelector("#cancelPass").onclick = ()=>overlay.remove();
    overlay.querySelector("form").onsubmit = (e)=>{
      e.preventDefault();
      const newPass = new FormData(e.target).get("newPass");
      DATA.adminPassword = newPass;
      saveData();
      overlay.remove();
      toast("تم تغيير كلمة مرور المدير");
    };
  };
}

/* ==========================================================
   Dashboard
   ========================================================== */
function renderDashboard(container){
  const sales = todaySales();
  const totalSalesToday = sales.reduce((s,x)=>s+x.total,0);
  const profitToday = sales.reduce((s,sale)=> s + sale.items.reduce((a,i)=>a+(i.price-i.cost)*i.qty,0), 0);
  const expToday = todayExpenses().reduce((s,e)=>s+Number(e.amount),0);
  const cashToday = sales.filter(s=>s.paymentMethod==="CASH").reduce((s,x)=>s+x.total,0);
  const creditToday = sales.filter(s=>s.paymentMethod==="CREDIT").reduce((s,x)=>s+x.total,0);
  const low = lowStockProducts();

  const last7 = [];
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const ds = todayStr(d);
    const daySales = DATA.sales.filter(s=>todayStr(s.date)===ds);
    const total = daySales.reduce((s,x)=>s+x.total,0);
    last7.push({date:ds.slice(5), total});
  }
  const maxVal = Math.max(1, ...last7.map(d=>d.total));

  const recentSales = [...DATA.sales].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,5);
  const recentProducts = [...DATA.products].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).slice(0,5);

  container.innerHTML = `
    <div class="stats-grid">
      <div class="stat-card highlight">
        <div class="label">💰 إجمالي مبيعات اليوم</div>
        <div class="value" style="font-size:32px">${money(totalSalesToday)}</div>
      </div>
      <div class="stat-card"><div class="label">عدد الفواتير اليوم</div><div class="value">${sales.length}</div></div>
      <div class="stat-card"><div class="label">أرباح اليوم</div><div class="value green">${money(profitToday)}</div></div>
      <div class="stat-card"><div class="label">صافي الربح بعد المصاريف</div><div class="value green">${money(profitToday-expToday)}</div></div>
    </div>
    <div class="stats-grid">
      <div class="stat-card"><div class="label">مبيعات نقدية</div><div class="value">${money(cashToday)}</div></div>
      <div class="stat-card"><div class="label">مبيعات آجلة</div><div class="value orange">${money(creditToday)}</div></div>
      <div class="stat-card"><div class="label">إجمالي الديون على العملاء</div><div class="value red">${money(totalDebts())}</div></div>
      <div class="stat-card"><div class="label">مصاريف اليوم</div><div class="value red">${money(expToday)}</div></div>
      <div class="stat-card"><div class="label">عدد المنتجات بالمخزون</div><div class="value">${DATA.products.length}</div></div>
      <div class="stat-card"><div class="label">منتجات كميتها منخفضة</div><div class="value orange">${low.length}</div></div>
    </div>
    <div class="charts-grid">
      <div class="panel">
        <h3>المبيعات - آخر 7 أيام</h3>
        <div style="display:flex;align-items:flex-end;gap:10px;height:180px;padding-top:10px;">
          ${last7.map(d=>`
            <div style="flex:1;text-align:center;">
              <div style="background:linear-gradient(180deg,#1a56db,#1544ac);border-radius:6px 6px 0 0;height:${Math.max(4,(d.total/maxVal)*140)}px;" title="${money(d.total)}"></div>
              <div style="font-size:11px;color:var(--text-muted);margin-top:6px;">${d.date}</div>
            </div>`).join("")}
        </div>
      </div>
      <div class="panel">
        <h3>منتجات كميتها منخفضة</h3>
        ${low.length===0?'<p style="color:var(--text-muted);font-size:13.5px;">لا يوجد نقص حاليًا</p>':""}
        ${low.map(p=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-size:13.5px;"><span>${esc(p.name)}</span><span class="badge low">${p.quantity} قطعة</span></div>`).join("")}
      </div>
    </div>
    <div class="charts-grid">
      <div class="panel">
        <h3>آخر عمليات البيع</h3>
        <table><thead><tr><th>الفاتورة</th><th>العميل</th><th>المبلغ</th><th>الدفع</th></tr></thead>
        <tbody>
          ${recentSales.length? recentSales.map(s=>`<tr><td>#${s.invoiceNumber}</td><td>${esc(s.customerName)||"عميل نقدي"}</td><td>${money(s.total)}</td><td>${s.paymentMethod==="CASH"?"نقدي":s.paymentMethod==="CREDIT"?"آجل":"تحويل"}</td></tr>`).join("") : '<tr class="empty-row"><td colspan="4">لا توجد مبيعات بعد</td></tr>'}
        </tbody></table>
      </div>
      <div class="panel">
        <h3>آخر المنتجات المضافة</h3>
        ${recentProducts.length? recentProducts.map(p=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-size:13.5px;"><span>${esc(p.name)}</span><span class="badge ${p.section==='NEW'?'new':'used'}">${p.section==='NEW'?'جديد':'مستعمل'}</span></div>`).join("") : '<p style="color:var(--text-muted);font-size:13.5px;">لا توجد منتجات بعد</p>'}
      </div>
    </div>
  `;
}

/* ==========================================================
   المنتجات
   ========================================================== */
let productSearch = "";
function renderProducts(container){
  const filtered = DATA.products.filter(p=>{
    if(!productSearch) return true;
    const q = productSearch.toLowerCase();
    return (p.name||"").toLowerCase().includes(q) || (p.barcode||"").toLowerCase().includes(q) || (p.serialNumber||"").toLowerCase().includes(q) || (p.brand||"").toLowerCase().includes(q);
  });

  container.innerHTML = `
    <div class="toolbar">
      <input class="input" style="max-width:320px" id="searchInput" placeholder="بحث بالاسم أو الباركود أو الرقم التسلسلي..." value="${productSearch}">
      ${canManageProducts()?'<button class="btn" id="addProductBtn">+ إضافة منتج</button>':""}
    </div>
    <div class="panel">
      <table>
        <thead><tr><th>المنتج</th><th>القسم</th><th>الماركة/الموديل</th><th>الباركود</th><th>سعر البيع</th><th>الكمية</th><th>الحالة</th><th></th></tr></thead>
        <tbody id="productsBody"></tbody>
      </table>
    </div>
  `;

  document.getElementById("searchInput").oninput = (e)=>{ productSearch = e.target.value; renderProducts(container); };
  if(canManageProducts()) document.getElementById("addProductBtn").onclick = ()=>openProductModal(container);

  const body = document.getElementById("productsBody");
  if(filtered.length===0){
    body.innerHTML = `<tr class="empty-row"><td colspan="8">لا توجد منتجات مطابقة</td></tr>`;
  } else {
    body.innerHTML = filtered.map(p=>`
      <tr>
        <td>${esc(p.name)}</td>
        <td><span class="badge ${p.section==='NEW'?'new':'used'}">${p.section==='NEW'?'جديد':'مستعمل'}</span></td>
        <td>${esc(p.brand)} ${esc(p.model)}</td>
        <td>${esc(p.barcode)||"—"}</td>
        <td>${money(p.salePrice)}</td>
        <td><span class="badge ${Number(p.quantity)<=Number(p.minQuantity??2)?'low':'ok'}">${p.quantity}</span></td>
        <td>${esc(p.status)||"—"}</td>
        <td>
          ${canManageProducts()?`<button class="btn secondary" data-edit="${p.id}">تعديل</button>`:""}
          ${canDelete()?`<button class="btn danger" data-del="${p.id}">حذف</button>`:""}
        </td>
      </tr>
    `).join("");
    body.querySelectorAll("[data-edit]").forEach(btn=>{
      btn.onclick = ()=>{
        const product = DATA.products.find(p=>p.id===btn.dataset.edit);
        openProductModal(container, product);
      };
    });
    body.querySelectorAll("[data-del]").forEach(btn=>{
      btn.onclick = ()=>{
        if(!confirm("هل أنت متأكد من حذف هذا المنتج؟")) return;
        DATA.products = DATA.products.filter(p=>p.id!==btn.dataset.del);
        saveData();
        renderProducts(container);
        toast("تم حذف المنتج");
      };
    });
  }
}

function openProductModal(pageContainer, existingProduct){
  const isEdit = !!existingProduct;
  const p = existingProduct || {};
  const used = p.usedDetails || {};
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <form class="modal-box" id="productForm">
      <h3>${isEdit ? "تعديل المنتج" : "إضافة منتج جديد"}</h3>
      <div id="formError"></div>
      <div class="form-grid">
        <div class="field full"><label>اسم المنتج</label><input class="input" name="name" required value="${esc(p.name)}"></div>
        <div class="field"><label>القسم</label>
          <select class="input" name="section" id="sectionSelect">
            <option value="NEW" ${p.section==="NEW"||!p.section?"selected":""}>جديد</option>
            <option value="USED" ${p.section==="USED"?"selected":""}>مستعمل</option>
          </select>
        </div>
        <div class="field"><label>التصنيف</label>
          <select class="input" name="category" required>
            <option value="">اختر...</option>
            ${DATA.categories.map(c=>`<option value="${esc(c)}" ${p.category===c?"selected":""}>${esc(c)}</option>`).join("")}
          </select>
        </div>
        <div class="field"><label>الماركة</label><input class="input" name="brand" value="${esc(p.brand)}"></div>
        <div class="field"><label>الموديل</label><input class="input" name="model" value="${esc(p.model)}"></div>
        <div class="field"><label>الرقم التسلسلي</label><input class="input" name="serialNumber" value="${esc(p.serialNumber)}"></div>
        <div class="field"><label>الباركود</label><input class="input" name="barcode" value="${esc(p.barcode)}"></div>
        <div class="field"><label>سعر الشراء</label><input type="number" step="0.01" min="0" class="input" name="purchasePrice" required value="${p.purchasePrice??""}"></div>
        <div class="field"><label>سعر البيع</label><input type="number" step="0.01" min="0" class="input" name="salePrice" required value="${p.salePrice??""}"></div>
        <div class="field"><label>الكمية</label><input type="number" min="0" class="input" name="quantity" required value="${p.quantity??""}"></div>
        <div class="field"><label>حد التنبيه للنقص</label><input type="number" min="0" class="input" name="minQuantity" value="${p.minQuantity??2}"></div>
        <div class="field full"><label>الضمان</label><input class="input" name="warranty" value="${esc(p.warranty)}"></div>
        <div id="usedFields" class="form-grid full ${p.section==="USED"?"":"hidden"}" style="grid-template-columns:1fr 1fr;">
          <div class="field full" style="border-top:1px solid var(--border);padding-top:8px;font-weight:700;font-size:13px;">تفاصيل الجهاز المستعمل</div>
          <div class="field"><label>حالة الجهاز</label><input class="input" name="condition" value="${esc(used.condition)}"></div>
          <div class="field"><label>سنة الصنع</label><input type="number" class="input" name="manufactureYear" value="${used.manufactureYear||""}"></div>
          <div class="field"><label>مصدر الجهاز</label><input class="input" name="source" value="${esc(used.source)}"></div>
          <div class="field"><label>تكلفة التصليح</label><input type="number" step="0.01" min="0" class="input" name="repairCost" value="${used.repairCost??0}"></div>
          <div class="field full"><label>ملاحظات عن الحالة</label><input class="input" name="conditionNotes" value="${esc(used.conditionNotes)}"></div>
        </div>
        <div class="field full"><label>ملاحظات عامة</label><input class="input" name="notes" value="${esc(p.notes)}"></div>
      </div>
      <div style="display:flex;gap:10px;margin-top:16px;">
        <button class="btn" type="submit">${isEdit ? "حفظ التعديلات" : "حفظ المنتج"}</button>
        <button class="btn secondary" type="button" id="cancelBtn">إلغاء</button>
      </div>
    </form>
  `;
  document.body.appendChild(overlay);
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
  overlay.querySelector("#cancelBtn").onclick = ()=>overlay.remove();
  overlay.querySelector("#sectionSelect").onchange = (e)=>{
    overlay.querySelector("#usedFields").classList.toggle("hidden", e.target.value!=="USED");
  };

  overlay.querySelector("#productForm").onsubmit = (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const section = fd.get("section");
    const newBarcode = fd.get("barcode");

    // التحقق من تكرار الباركود، باستثناء المنتج نفسه في وضع التعديل
    if(newBarcode && DATA.products.some(x=>x.barcode===newBarcode && x.id!==p.id)){
      overlay.querySelector("#formError").innerHTML = '<div class="error-box">هذا الباركود مستخدم مسبقًا لمنتج آخر</div>';
      return;
    }
    const newSerial = fd.get("serialNumber");
    if(newSerial && DATA.products.some(x=>x.serialNumber===newSerial && x.id!==p.id)){
      overlay.querySelector("#formError").innerHTML = '<div class="error-box">هذا الرقم التسلسلي مستخدم مسبقًا لمنتج آخر</div>';
      return;
    }

    const updated = {
      id: isEdit ? p.id : uid("prod"),
      name: fd.get("name"),
      section,
      category: fd.get("category"),
      brand: fd.get("brand"),
      model: fd.get("model"),
      serialNumber: newSerial || null,
      barcode: newBarcode || null,
      purchasePrice: Number(fd.get("purchasePrice")),
      salePrice: Number(fd.get("salePrice")),
      quantity: Number(fd.get("quantity")),
      minQuantity: Number(fd.get("minQuantity"))||2,
      warranty: fd.get("warranty"),
      notes: fd.get("notes"),
      status: section==="USED" ? (fd.get("condition")||"") : "جديد",
      createdAt: isEdit ? p.createdAt : new Date().toISOString(),
    };
    if(section==="USED"){
      const repairCost = Number(fd.get("repairCost"))||0;
      const totalCost = updated.purchasePrice + repairCost;
      updated.usedDetails = {
        condition: fd.get("condition"),
        manufactureYear: fd.get("manufactureYear") ? Number(fd.get("manufactureYear")) : null,
        source: fd.get("source"),
        repairCost,
        totalCost,
        expectedProfit: updated.salePrice - totalCost,
        conditionNotes: fd.get("conditionNotes"),
      };
    }

    if(isEdit){
      const idx = DATA.products.findIndex(x=>x.id===p.id);
      DATA.products[idx] = updated;
    } else {
      DATA.products.push(updated);
    }
    const saved = saveData();
    overlay.remove();
    renderProducts(pageContainer);
    if(saved) toast(isEdit ? "تم حفظ تعديلات المنتج بنجاح ✅" : "تمت إضافة المنتج وحفظه بنجاح ✅");
  };
}

          <input type="number" class="input" id="paidInput" value="0" min="0">
        </div>

        <div class="total-row"><span>الإجمالي الفرعي</span><span id="subtotalDisplay">${money(subtotal)}</span></div>
        <div class="total-row grand"><span>الإجمالي النهائي</span><span id="grandDisplay">${money(subtotal)}</span></div>

        <button class="btn" id="checkoutBtn" style="width:100%;margin-top:12px;" ${cart.length===0?"disabled":""}>إتمام البيع وإصدار الفاتورة</button>
      </div>
    </div>
  `;

  document.getElementById("posSearch").oninput = (e)=>{ posSearch = e.target.value; renderPOS(container); };
  container.querySelectorAll("[data-add]").forEach(el=>{
    el.onclick = ()=>{
      const p = DATA.products.find(x=>x.id===el.dataset.add);
      const existing = cart.find(i=>i.productId===p.id);
      if(existing){
        if(existing.qty < p.quantity) existing.qty++;
      } else {
        cart.push({productId:p.id, name:p.name, price:p.salePrice, cost:p.purchasePrice, qty:1, maxQty:p.quantity});
      }
      renderPOS(container);
    };
  });
  container.querySelectorAll("[data-inc]").forEach(el=>{
    el.onclick = ()=>{
      const item = cart.find(i=>i.productId===el.dataset.inc);
      const p = DATA.products.find(x=>x.id===item.productId);
      if(item.qty < p.quantity) item.qty++;
      renderPOS(container);
    };
  });
  container.querySelectorAll("[data-dec]").forEach(el=>{
    el.onclick = ()=>{
      const idx = cart.findIndex(i=>i.productId===el.dataset.dec);
      cart[idx].qty--;
      if(cart[idx].qty<=0) cart.splice(idx,1);
      renderPOS(container);
    };
  });

  document.getElementById("custName").oninput = (e)=>{ posCustomerName = e.target.value; };
  document.getElementById("custPhone").oninput = (e)=>{ posCustomerPhone = e.target.value; };

  const discountInput = document.getElementById("discountInput");
  const paymentSelect = document.getElementById("paymentMethod");
  const paidWrap = document.getElementById("paidWrap");
  const paidInput = document.getElementById("paidInput");

  const custNameInput = document.getElementById("custName");
  const custNameHint = document.getElementById("custNameHint");
  const custNameLabel = document.getElementById("custNameLabel");

  function updateTotals(){
    const discount = Number(discountInput.value)||0;
    const grand = Math.max(0, subtotal - discount);
    document.getElementById("grandDisplay").textContent = money(grand);
    if(paymentSelect.value==="CREDIT"){
      paidWrap.classList.remove("hidden");
      custNameHint.classList.remove("hidden");
      custNameLabel.textContent = "اسم العميل (إلزامي للبيع الآجل)";
      custNameLabel.style.color = "var(--danger)";
    } else {
      paidWrap.classList.add("hidden");
      paidInput.value = grand;
      custNameHint.classList.add("hidden");
      custNameLabel.textContent = "العميل (اختياري - للنقدي اتركه فارغًا)";
      custNameLabel.style.color = "";
    }
  }
  discountInput.oninput = updateTotals;
  paymentSelect.onchange = ()=>{
    updateTotals();
    if(paymentSelect.value==="CREDIT") custNameInput.focus();
  };
  updateTotals();

  document.getElementById("checkoutBtn").onclick = ()=>{
    const paymentMethod = paymentSelect.value;

    // تحقق إلزامي: لا يجوز إتمام بيع آجل بدون اسم عميل، وإلا يضيع الدين بلا صاحب
    if(paymentMethod==="CREDIT" && !posCustomerName.trim()){
      alert("لازم تدخل اسم العميل قبل إتمام بيع آجل، حتى يتم تسجيل الدين على اسمه ويظهر بقائمة العملاء.");
      custNameInput.focus();
      return;
    }

    const discount = Number(discountInput.value)||0;
    const grand = Math.max(0, subtotal - discount);
    let paid = paymentMethod==="CREDIT" ? (Number(paidInput.value)||0) : grand;
    if(paid > grand) paid = grand;
    const remaining = grand - paid;

    let customerId = null;
    {
      // كل فاتورة، حتى لو بدون اسم عميل، تُسجَّل تلقائيًا بقائمة العملاء
      // تحت "زبون نقدي" الافتراضي، حتى لا تبقى القائمة فاضية أبدًا
      const nameToUse = posCustomerName.trim() || "زبون نقدي";
      const phone = (posCustomerPhone||"").trim();
      let customer = DATA.customers.find(c=>
        c.name===nameToUse && (phone ? c.phone===phone : !c.phone)
      );
      if(!customer){
        customer = {id:uid("cust"), name:nameToUse, phone, address:"", totalAmount:0, paidAmount:0, remainingAmount:0, payments:[]};
        DATA.customers.push(customer);
      }
      customer.totalAmount += grand;
      customer.paidAmount += paid;
      customer.remainingAmount += remaining;
      customerId = customer.id;
    }

    const invoiceNumber = DATA.invoiceSeq++;
    const sale = {
      id: uid("sale"),
      invoiceNumber,
      date: new Date().toISOString(),
      customerId,
      customerName: posCustomerName.trim() || null,
      items: cart.map(i=>({productId:i.productId, name:i.name, qty:i.qty, price:i.price, cost:i.cost, total:i.price*i.qty})),
      subtotal, discount, total: grand, paid, remaining: remaining,
      paymentMethod,
    };
    DATA.sales.push(sale);

    cart.forEach(i=>{
      const p = DATA.products.find(x=>x.id===i.productId);
      if(p) p.quantity = Math.max(0, Number(p.quantity) - i.qty);
    });

    cart = []; posCustomerName=""; posCustomerPhone=""; posSearch="";
    const saved = saveData();
    renderPage();
    if(saved) toast(`تم إصدار الفاتورة رقم #${invoiceNumber} وحفظها بنجاح ✅`);
  };
}

function renderReports(container){
  container.innerHTML = `
    <div class="panel">
      <h3>تقرير المبيعات حسب الفترة</h3>
      <div class="form-grid" style="margin-bottom:14px;">
        <div class="field"><label>من تاريخ</label><input type="date" class="input" id="fromDate"></div>
        <div class="field"><label>إلى تاريخ</label><input type="date" class="input" id="toDate"></div>
      </div>
      <button class="btn" id="genReportBtn">إنشاء التقرير</button>
      <div id="reportResult" style="margin-top:18px;"></div>
    </div>
    <div class="charts-grid">
      <div class="panel">
        <h3>المنتجات الأكثر مبيعًا</h3>
        <div id="topProducts"></div>
      </div>
      <div class="panel">
        <h3>منتجات لم تُبع بعد</h3>
        <div id="unsoldProducts"></div>
      </div>
    </div>
  `;

  const soldQty = {};
  DATA.sales.forEach(s=>s.items.forEach(i=>{ soldQty[i.productId] = (soldQty[i.productId]||0) + i.qty; }));
  const topSorted = Object.entries(soldQty).sort((a,b)=>b[1]-a[1]).slice(0,6);
  document.getElementById("topProducts").innerHTML = topSorted.length? topSorted.map(([pid,qty])=>{
    const p = DATA.products.find(x=>x.id===pid);
    return `<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-size:13.5px;"><span>${p?esc(p.name):"منتج محذوف"}</span><span class="badge ok">${qty} مباع</span></div>`;
  }).join("") : '<p style="color:var(--text-muted);font-size:13.5px;">لا توجد مبيعات بعد</p>';

  const unsold = DATA.products.filter(p=>!soldQty[p.id]);
  document.getElementById("unsoldProducts").innerHTML = unsold.length? unsold.slice(0,10).map(p=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-size:13.5px;"><span>${esc(p.name)}</span><span class="badge low">لم يُبع</span></div>`).join("") : '<p style="color:var(--text-muted);font-size:13.5px;">كل المنتجات تم بيعها من قبل</p>';

  document.getElementById("genReportBtn").onclick = ()=>{
    const from = document.getElementById("fromDate").value;
    const to = document.getElementById("toDate").value;
    if(!from || !to){ alert("الرجاء تحديد الفترة"); return; }
    const filtered = DATA.sales.filter(s=>{ const d = todayStr(s.date); return d>=from && d<=to; });
    const totalSales = filtered.reduce((s,x)=>s+x.total,0);
    const totalProfit = filtered.reduce((s,sale)=> s + sale.items.reduce((a,i)=>a+(i.price-i.cost)*i.qty,0), 0);
    const filteredExpenses = DATA.expenses.filter(e=>{ const d=todayStr(e.date); return d>=from && d<=to; });
    const totalExp = filteredExpenses.reduce((s,e)=>s+Number(e.amount),0);

    document.getElementById("reportResult").innerHTML = `
      <div class="stats-grid">
        <div class="stat-card"><div class="label">عدد الفواتير</div><div class="value">${filtered.length}</div></div>
        <div class="stat-card"><div class="label">إجمالي المبيعات</div><div class="value">${money(totalSales)}</div></div>
        <div class="stat-card"><div class="label">إجمالي الأرباح</div><div class="value green">${money(totalProfit)}</div></div>
        <div class="stat-card"><div class="label">صافي الربح بعد المصاريف</div><div class="value green">${money(totalProfit-totalExp)}</div></div>
      </div>
    `;
  };
}
